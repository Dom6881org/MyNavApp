name: Cleanup merged branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ["copilot/fix-opaque-response-blocking","copilot/light-mode-sub-menu-cards","dependabot/npm_and_yarn/multi-b1658bdecd","feature/ui-weather-unzoom-density","feature/open-meteo-rate-limit","feature/routing-grib","feature/grib-offline-first","feature/routing-integration","feature/eccodes-pip","feature/eccodes-pip-v2","feature/release-v1-1-0"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete branch if fully merged into main
        run: |
          git fetch origin main
          if git rev-parse --verify origin/${{ matrix.branch }} >/dev/null 2>&1; then
            if git merge-base --is-ancestor origin/${{ matrix.branch }} origin/main; then
              echo "${{ matrix.branch }} est mergee dans main — suppression."
              git push origin --delete ${{ matrix.branch }} || echo "deja supprimee"
            else
              echo "${{ matrix.branch }} contient des commits non mergess — conservee."
            fi
          else
            echo "${{ matrix.branch }} inexistante (deja supprimee ?) — ok."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
