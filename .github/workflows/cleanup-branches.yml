name: Cleanup merged branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ["copilot/fix-opaque-response-blocking","copilot/light-mode-sub-menu-cards","dependabot/npm_and_yarn/multi-b1658bdecd","feature/ui-weather-unzoom-density","feature/open-meteo-rate-limit","feature/routing-grib","feature/grib-offline-first","feature/routing-integration","feature/eccodes-pip","feature/eccodes-pip-v2","feature/release-v1-1-0"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete branch if fully merged into main
        run: |
          git fetch origin main
          if git rev-parse --verify origin/${{ matrix.branch }} >/dev/null 2>&1; then
            if git merge-base --is-ancestor origin/${{ matrix.branch }} origin/main; then
              echo "${{ matrix.branch }} est mergee dans main — suppression."
              git push origin --delete ${{ matrix.branch }} || echo "deja supprimee"
            else
              echo "${{ matrix.branch }} contient des commits non mergess — conservee."
            fi
          else
            echo "${{ matrix.branch }} inexistante (deja supprimee ?) — ok."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  cleanup-squash:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch:
          - feature/eccodes-pip
          - feature/eccodes-pip-v2
          - feature/grib-offline-first
          - feature/release-v1-1-0
          - copilot/fix-failing-github-actions-job
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete squash-merged branch (PR mergee avec tip identique)
        run: |
          BR="${{ matrix.branch }}"
          if ! git rev-parse --verify "origin/$BR" >/dev/null 2>&1; then echo "$BR absente — ok."; exit 0; fi
          TIP=$(git rev-parse "origin/$BR")
          MERGED=$(gh pr list --state merged --head "$BR" --json headRefOid --jq '.[0].headRefOid')
          if [ "$MERGED" = "$TIP" ]; then
            echo "$BR : PR mergee (squash) avec ce tip — suppression."
            git push origin --delete "$BR" || echo "deja supprimee"
          else
            echo "$BR : aucune PR mergee avec ce tip — conservee."
          fi
        env:
          GH_TOKEN: ${{ github.token }}